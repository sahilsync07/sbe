name: Build and Release SBE Hub to Google Play

on:
  push:
    paths:
      - 'sbe-hub/**'
      - 'frontend/src/**'
      - '.github/workflows/sbe-hub-release.yml'
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

concurrency:
  group: google-play-deploy-sbe-hub
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            sbe-hub/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Install SBE Hub Dependencies & Build
        run: |
          cd sbe-hub
          npm install
          npm run build
          npx cap sync android

      - name: Calculate Version Code
        id: version_code
        run: echo "code=$(( ${{ github.run_number }} + 200000 ))" >> $GITHUB_OUTPUT

      - name: Bump Version Code
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: sbe-hub/android/app/build.gradle
          versionCode: ${{ steps.version_code.outputs.code }}

      - name: Build Release App Bundle (.AAB)
        working-directory: sbe-hub/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.sbe.hub
          releaseFiles: sbe-hub/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}